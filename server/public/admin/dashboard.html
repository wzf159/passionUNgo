<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard – SENSE Admin</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif; background: #eaf2f5; min-height: 100vh;
  }
  nav {
    background: #3d6475; color: #fff; padding: 16px 32px; display: flex;
    align-items: center; justify-content: space-between;
  }
  nav h1 { font-size: 18px; font-weight: 600; }
  nav a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; }
  nav a:hover { color: #fff; }
  .container { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
  .card {
    background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(61,100,117,0.08);
  }
  .card h2 { color: #3d6475; font-size: 16px; margin-bottom: 4px; }
  .card .count { font-size: 40px; font-weight: 800; color: #5a9aaa; }
  .card p { color: #7a9baa; font-size: 13px; }
  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .links a {
    display: block; background: #fff; border-radius: 12px; padding: 20px 24px;
    text-decoration: none; color: #3d6475; font-weight: 600; font-size: 15px;
    box-shadow: 0 2px 12px rgba(61,100,117,0.08); transition: transform 0.2s, box-shadow 0.2s;
  }
  .links a:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(61,100,117,0.15); }
  .links a span { display: block; font-weight: 400; font-size: 13px; color: #7a9baa; margin-top: 4px; }
</style>
</head>
<body>
<nav>
  <h1>🏠 SENSE Admin</h1>
  <a href="index.html" onclick="logout()">Sign Out</a>
</nav>
<div class="container">
  <div class="cards">
    <div class="card">
      <h2>Registrations</h2>
      <div class="count" id="regCount">—</div>
      <p>Event sign-ups</p>
    </div>
    <div class="card">
      <h2>Volunteers</h2>
      <div class="count" id="volCount">—</div>
      <p>Volunteer applications</p>
    </div>
  </div>
  <div class="links">
    <a href="registrations.html">
      View Registrations
      <span>Browse all event registration records</span>
    </a>
    <a href="volunteers.html">
      View Volunteers
      <span>Browse all volunteer applications</span>
    </a>
  </div>
</div>
<script>
  function getAuth() { return sessionStorage.getItem('admin_token'); }
  function logout() { sessionStorage.removeItem('admin_token'); }
  async function loadCounts() {
    const token = getAuth();
    if (!token) { window.location.href = 'index.html'; return; }
    const headers = { 'Authorization': `Basic ${token}` };
    try {
      const [reg, vol] = await Promise.all([
        fetch('/api/admin/registrations', { headers }).then(r => r.json()),
        fetch('/api/admin/volunteers', { headers }).then(r => r.json()),
      ]);
      document.getElementById('regCount').textContent = reg.length;
      document.getElementById('volCount').textContent = vol.length;
    } catch (err) { console.error(err); }
  }
  loadCounts();
</script>
</body>
</html>
